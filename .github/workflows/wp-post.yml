name: Post WP Article
on:
  workflow_dispatch:
    inputs:
      encoded_creds:
        description: 'Base64-encoded WP credentials'
        required: true
        type: string
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Post to WordPress
        env:
          ENCODED_CREDS: ${{ github.event.inputs.encoded_creds }}
        run: python3 .github/post_article.py
